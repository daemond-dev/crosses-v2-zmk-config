# Right half is the split central, so these only apply to its build.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Studio boots locked and the lock state is never persisted, so every restart costs an unlock
# keypress. Only imply'd on by ZMK_STUDIO_RPC, so this =n wins.
CONFIG_ZMK_STUDIO_LOCKING=n

# Right half is the split central, so these only apply to its build.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Studio boots locked and the lock state is never persisted, so every restart costs an unlock
# keypress. Only imply'd on by ZMK_STUDIO_RPC, so this =n wins.
CONFIG_ZMK_STUDIO_LOCKING=n

# Boot protocol so BIOS/UEFI screens and pre-boot PIN prompts can use the right half over USB.
CONFIG_ZMK_USB_BOOT=y

# Default 30 B. A Studio request that doesn't fit spins the BT RX thread and freezes the board.
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=256

# Default 5. Left keys, left ball and battery share this queue, and overflow drops silently.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_POSITION_QUEUE_SIZE=32

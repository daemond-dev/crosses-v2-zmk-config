# Both halves. ZMK's default is 15 min (900000). Each half counts its own inactivity.
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Overrides the board DTS release debounce of 20 ms (press stays at 4 ms).
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=10

# Skip a late radio event instead of halting on LL_ASSERT_OVERHEAD. The symbol sits in the
# controller's advanced menu, so without ADVANCED_FEATURES the =n is dropped.
CONFIG_BT_CTLR_ADVANCED_FEATURES=y
CONFIG_BT_CTLR_ASSERT_OVERHEAD_START=n

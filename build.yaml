# One-off build: right half that clears host bonds and the stored left-half address on
# every boot, keeping the keymap. Flash once, then reflash the normal right image.
include:
  - board: crosses_v2_right
    shield: raw_hid_adapter
    artifact-name: crosses_v2_54_right_clear_bonds
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DDTS_EXTRA_CPPFLAGS="-DZMK_BEHAVIORS_KEEP_ALL" -DCONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=y
